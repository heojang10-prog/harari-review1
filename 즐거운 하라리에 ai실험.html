<section id="s1"><div class="big">01</div><h2>PROMPT ✦ 여섯 요소가 정하는 것</h2><div class="grid">

<section id="s2"><div class="big">02</div><h2>TEXT ✦ 이 글은?</h2><div class="box c2">
<p><b>글쓴이</b> Yuval Noah Harari (『사피엔스』 · TED 2015 기반)<br><b>제목</b> Why Humans Rule the World: The Power of Shared Fictions<br><b>글의 유형</b> TOEIC Part 7식 기사형 설명문 (5문단)</p>
<p><b>한 줄 요약</b> 인간이 지구를 지배하는 이유는 ‘공유된 허구’를 믿고 낯선 사람과도 유연하게 대규모로 협력하기 때문이다.<br><i>Humans rule because shared fictions let strangers cooperate flexibly in huge numbers.</i></p>
<b>문단 흐름</b><ol style="margin:6px 0 0;padding-left:20px"><li><b>¶1</b> 인간은 왜 지배하는가? 유연하고 대규모인 협력.</li><li><b>¶2</b> 개미·벌은 경직, 침팬지·늑대는 소규모. 인간만 둘 다.</li><li><b>¶3</b> 상상 속 실재(돈·국가·법) = shared fictions. “fiction”은 모욕이 아님.</li><li><b>¶4</b> 인지혁명(약 7만 년 전). 뒷담화는 집단 추적, 신화는 낯선 이들의 결속.</li><li><b>¶5</b> 제도는 이야기라서 다시 쓸 수 있다. 이해가 개선의 첫걸음.</li></ol></div></section>

const NOT="수업 자료에는 없는 내용이에요.",OTHER="이 앱은 Yuval Noah Harari의 글만 다뤄요.";
const T="너는 ‘화난 선생님’ 말투(화내되 학생을 존중, 욕설 금지)로 한국어+영어로 답하는 복습 도우미다. 아래 NOTES만 근거로 삼는다. 규칙: 모든 답에 근거 문단을 [Harari ¶3]처럼 표시. 10문장 이내. 과제·영작을 대신 써 주지 않고 힌트와 근거 위치를 알려 준다. NOTES에 없는 질문(예: 저자의 사생활·생일)은 정확히 “"+NOT+"”라고만 답한다. Harari 글이 아닌 다른 글·책 질문은 정확히 “"+OTHER+"”라고 답한다. 추측 금지.\nNOTES:\n¶1 Why do humans rule? One human vs chimp alone: chimp probably survives longer; 1000 vs 1000 humans win. Humans are the only animals that cooperate flexibly in very large numbers.\n¶2 Bees/ants: huge colonies but rigid, cannot change hive rules. Chimps/wolves: flexible but only small groups of people who know each other. Humans combine both; strangers work toward common goals (cathedral, corporation, government).\n¶3 Humans believe in things that exist only in imagination: nations, money, laws, corporations. A dollar bill has value only because everyone trusts others will accept it; without trust it is worthless. Harari calls these collective beliefs “shared fictions”; “fiction” is not an insult; they are the most powerful inventions in human history.\n¶4 Cognitive Revolution ~70,000 years ago: before, humans communicated like animals (predators, food). After: could talk about things that do not exist. Gossip let them keep track of larger groups; myths let them unite groups with no personal connection. Stories, not physical advantage, let Homo sapiens spread.\n¶5 If institutions are stories, they can be rewritten; empires collapsed in a decade, trusted currencies became worthless overnight. He does not say abandon them; understanding how they work is the first step toward improving them.";
const KB=[[/shared fiction|허구|fiction/i,3,"shared fictions = 수많은 사람이 함께 믿는 상상 속 실재(돈·국가·법·회사)야. 거짓말이 아니고, ‘fiction’은 모욕이 아니라고 했어. 제대로 읽었어?\nCollective beliefs that exist only in imagination yet are powerful."],[/gossip|myth|뒷담|신화/i,4,"gossip은 더 큰 집단을 파악하게 해 주고, myth는 서로 모르는 사람들까지 묶어 줬어. 역할이 다르잖아!\nGossip tracks larger groups; myths unite strangers."],[/money|dollar|돈|지폐/i,3,"지폐는 그 자체로 가치가 없어. 모두가 서로 받아 줄 거라 믿기 때문에 가치가 생겨.\nValue comes from shared trust."],[/cooperat|협력|bee|ant|chimp|wolf|벌|개미|침팬/i,2,"개미·벌은 대규모지만 경직, 침팬지·늑대는 유연하지만 소규모. 인간만 둘 다 해.\nOnly humans are flexible AND large-scale."],[/cognitive|인지|혁명/i,4,"약 7만 년 전, 존재하지 않는 것을 말할 수 있게 된 변화야.\nRoughly 70,000 years ago, language about non-existent things."],[/rewrite|institution|결론|eternal|제도/i,5,"제도도 이야기라서 다시 쓸 수 있어. 버리자는 게 아니라 이해가 개선의 첫걸음이야.\nUnderstanding is the first step."]];
const log=$("#log");let mode=null,cur=null,tries=0,qi=0,hist=[];
function say(r,t){const d=document.createElement("div");d.className="m "+(r=="u"?"u":"b");d.innerHTML=esc(t).replace(/\n/g,"<br>");log.appendChild(d);log.scrollTop=log.scrollHeight}
function reset(){log.innerHTML="";mode=cur=null;hist=[];say("b","또 왔어? 앉아. 워크북에 있는 것만 묻는다. 모든 답엔 근거 문단이 붙어.\nSit down. I only answer from the workbook. Try: “shared fictions가 뭐야?”")}
const norm=s=>s.toLowerCase().replace(/[^a-z가-힣 ]/g,"").trim();
function quiz(){const q=RQ[qi%8];cur={t:"q",q,n:qi%8};tries=0;mode="quiz";say("b","독해 문제 "+(cur.n+1)+"/8 (한 번에 한 문제!)\n"+q[0]+"\n"+q[1].map((o,i)=>"("+"ABCD"[i]+") "+o).join("\n")+"\n\n💡 힌트 먼저: "+q[4]+"\n A–D로 답해. 포기하려면 ‘포기’.")}
function game(){const w=V[Math.random()*20|0];cur={t:"g",w};tries=0;mode="game";say("b","단어 게임! 뜻을 보고 영어 단어를 써.\n“"+w[2]+"”\n💡 힌트: "+w[0][0]+"로 시작, "+w[0].replace(/ /g,"").length+"글자. [Harari ¶"+w[4]+"]\n그만하려면 ‘그만’.")}
function gram(){mode="gram";say("b","문법 번호(1–8)를 입력해. 직접 해석해 보고 확인해!\n"+G.map((g,i)=>(i+1)+". "+g[0]).join("\n"))}
function handle(t){
 if(/^(그만|stop|exit)$/i.test(t)){mode=cur=null;say("b","좋아, 여기까지. 복습은 매일 해!");return true}
 if(mode=="quiz"&&cur){const q=cur.q,m=t.match(/^\(?([a-d])\)?\b/i);
  if(/포기|모르겠|give up/i.test(t)){say("b","포기가 빠르군. 정답은 ("+"ABCD"[q[2]]+") "+q[1][q[2]]+" [Harari ¶"+q[3]+"]. 이 문단을 다시 읽어!\nAnswer: ("+"ABCD"[q[2]]+") ");qi++;mode=cur=null;return true}
  if(!m)return false;
  if(m[1].toUpperCase()=="ABCD"[q[2]]){say("b","이제야 맞혔네. 정답 ("+"ABCD"[q[2]]+") [Harari ¶"+q[3]+"]. 근거 문장을 소리 내 읽어 봐.\nCorrect. 다음 문제는 ‘요약 점검’ 버튼!");qi++;mode=cur=null}
  else{tries++;say("b","틀렸어! 정답은 안 알려 줘.\n💡 힌트 "+(tries+1)+": "+(tries==1?q[5]:"해당 문단의 첫 문장부터 다시 읽어. [Harari ¶"+q[3]+"] 정말 모르겠으면 ‘포기’.")+(tries==1?" [Harari ¶"+q[3]+"]":""))}
  return true}
 if(mode=="game"&&cur){const w=cur.w;
  if(norm(t)==w[0]){say("b","맞았어! "+w[0]+" = "+w[2]+" [Harari ¶"+w[4]+"]\n문맥: "+w[3]+"\n한 번 더? ‘단어 게임’ 버튼!");mode=cur=null}
  else{tries++;say("b","땡! 정답은 안 알려 준다.\n💡 문맥 힌트: "+w[3].replace(new RegExp(w[0].slice(0,4),"i"),"____")+" [Harari ¶"+w[4]+"]\n다시 써 봐. 그만하려면 ‘그만’.")}
  return true}
 if(mode=="gram"&&/^[1-8]$/.test(t)){const g=G[t-1];say("b",g[0]+"\n"+g[1]+"\n예: "+g[2]+" [Harari ¶"+g[3]+"]\n다른 번호도 골라 봐!");return true}
 return false}
async function ask(t){
 if(/생일|태어|출생|몇\s*살|나이|결혼|가족|아내|남편|연봉|born|birthday|how old|married/i.test(t)){say("b",NOT+" 워크북에 없는 건 안 지어내!\nNot in the workbook.");return}
 if(/다른\s*(글|책|작품|지문|저자|작가)|호모\s*데우스|homo deus|21\s*lessons|오웰|1984|동물농장|셰익스피어|해리\s*포터|other (essay|book|text|article)/i.test(t)){say("b",OTHER+" 다른 글은 다른 수업에서 물어봐!\nThis app covers only Harari’s text.");return}
 const th=document.createElement("div");th.className="m b";th.textContent="생각 중… (선생님 화나는 중)";log.appendChild(th);
 try{const s=await claude.use("sample");if(!s)throw 0;
  const r=await s([...hist.slice(-6),{role:"user",content:T+"\n\nQUESTION: "+t}],{cache:false,modelTier:"quick"});
  th.remove();say("b",r.text);hist.push({role:"user",content:t},{role:"assistant",content:r.text})}
 catch(e){th.remove();const k=KB.find(x=>x[0].test(t));
  say("b",k?k[2]+" [Harari ¶"+k[1]+"]\n(AI 연결 없이 워크북 노트로 답했어.)":NOT+"\n(AI 연결이 없어 노트에 있는 키워드만 찾을 수 있어요.)")}}
async function send(t){t=(t||$("#q").value).trim();if(!t)return;$("#q").value="";say("u",t);if(!handle(t))await ask(t)}
$("#go").onclick=()=>send();$("#q").onkeydown=e=>{if(e.key=="Enter"&&!e.isComposing)send()};$("#nw").onclick=reset;
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const k=b.dataset.q;say("u",b.textContent);k=="quiz"?quiz():k=="gram"?gram():game()});
reset();
/* VOCAB */
$("#vt").innerHTML="<tr><th>Word</th><th>POS</th><th>Meaning (EN)</th><th>Example</th></tr>"+V.map(v=>"<tr><td><b>"+v[0]+"</b></td><td>"+v[1]+"</td><td>"+v[2]+"</td><td>"+esc(v[3])+" <small>¶"+v[4]+"</small></td></tr>").join("");
let S;const vq=$("#vq");
function start(list,rd){S={list:shuf(list),i:0,score:0,wrong:[],rd:rd||0};show()}
function show(){if(S.i>=S.list.length)return done();const w=S.list[S.i],ty=(V.indexOf(w)+S.rd)%3,pct=S.i/S.list.length*100;
 let h='<div class="bar"><i style="width:'+pct+'%"></i></div><p><b>'+(S.i+1)+' / '+S.list.length+'</b> · 점수 '+S.score+'</p>';
 const opts=k=>shuf([w,...shuf(V.filter(x=>x!=w)).slice(0,3)]);
 if(ty==0){h+='<p>뜻 고르기: <b style="font-size:22px">'+w[0]+' ('+w[1]+')</b></p>'+opts().map(o=>'<button class="btn opt" data-a="'+(o==w?1:0)+'">'+esc(o[2])+'</button>').join("")}
 else if(ty==1){h+='<p>단어 고르기: “'+esc(w[2])+'”</p>'+opts().map(o=>'<button class="btn opt" data-a="'+(o==w?1:0)+'">'+o[0]+'</button>').join("")}
 else h+='<p>직접 쓰기: “'+esc(w[2])+'” <small>('+w[1]+', '+w[0].replace(/ /g,"").length+'글자)</small></p><div class="row"><input type="text" id="vi" autocapitalize="none" autocomplete="off"><button class="btn dk" id="vc">확인</button></div>';
 h+='<div id="vf"></div>';vq.innerHTML=h;
 const fin=ok=>{if(ok)S.score++;else S.wrong.push(w);$("#vf").innerHTML='<p><b>'+(ok?"✓ 정답":"✗ 오답 — 정답: "+w[0])+'</b> · '+esc(w[3])+' <small>[Harari ¶'+w[4]+']</small></p><button class="btn dk" id="nx">'+(S.i+1>=S.list.length?"결과 보기":"다음")+'</button>';$("#nx").onclick=()=>{S.i++;show()};vq.querySelectorAll(".opt,#vc,#vi").forEach(e=>e.disabled=true)};
 vq.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.a=="1";b.classList.add(ok?"ok":"no");fin(ok)});
 if(ty==2){const go=()=>fin(norm($("#vi").value)==w[0]);$("#vc").onclick=go;$("#vi").onkeydown=e=>{if(e.key=="Enter"&&!e.isComposing)go()}}}
function done(){vq.innerHTML='<div class="bar"><i style="width:100%"></i></div><h3>결과: '+S.score+' / '+S.list.length+'</h3>'+(S.wrong.length?'<p>틀린 단어: <b>'+S.wrong.map(w=>w[0]).join(", ")+'</b></p><button class="btn dk" id="rt">틀린 단어만 다시</button>':'<p>전부 맞았어! 🎉</p>')+'<button class="btn" id="ra">처음부터 (20개)</button>';
 if(S.wrong.length)$("#rt").onclick=()=>start(S.wrong,S.rd+1);$("#ra").onclick=()=>start(V)}
vq.innerHTML='<p>워크북 어휘 20개를 한 번씩 풉니다. 뜻 고르기 · 단어 고르기 · 직접 쓰기. 채점은 앱의 코드가 합니다.</p><button class="btn dk" id="vs">시작하기</button>';$("#vs").onclick=()=>start(V);
</script></body></html>
